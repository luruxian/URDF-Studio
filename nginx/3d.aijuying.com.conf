server {
  server_name 3d.aijuying.com;

  root /home/gcb-user/projects/URDF-Studio/dist;
  index index.html;

  types_hash_max_size 2048;
  # Do not force application/octet-stream as the server default: module workers,
  # WASM, and other hashed /assets/* chunks rely on correct JavaScript/WASM MIME.
  types {
    application/javascript js mjs;
    application/wasm wasm;
    text/css css;
    text/html html;
  }

  client_max_body_size 100m;

  # LLM proxy (MiniMax / OpenAI-compatible). Dev uses Vite proxy (vite.config.ts:
  # resolveLlmDevProxy); production must forward here. Upstream MUST match
  # .env's URDF_STUDIO_LLM_UPSTREAM so dev and prod stay equivalent.
  location /api/llm-proxy/ {
    proxy_pass https://api.minimaxi.com/;
    proxy_http_version 1.1;

    proxy_set_header Host api.minimaxi.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SSE / streaming: disable buffering, force HTTP/1.1, clear hop-by-hop
    # Connection header so chunked transfer reaches the browser.
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Connection "";
    chunked_transfer_encoding off;

    # Generous timeouts for long model outputs.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location / {
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri $uri/ /index.html;
  }

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
  }

  location = /_headers {
    deny all;
    return 404;
  }

  location ~* ^/(assets|fonts|logos|wasm|usd/bindings)/ {
    access_log off;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    try_files $uri =404;
  }

  location ~* \.(?:png|jpg|jpeg|svg|webp|ico|gif|woff2?|ttf|otf|eot|hdr|pdf)$ {
    access_log off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
    try_files $uri =404;
  }

  location ~* \.(usd|usda|usdc|xml|json)$ {
    expires 1h;
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
  }

  # webmanifest 默认 mime 没有，用独立 location 补
  location = /manifest.webmanifest {
    types { application/manifest+json webmanifest; }
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
  }

  location ~ /\.(?!well-known) {
    deny all;
  }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/3d.aijuying.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/3d.aijuying.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}server {
    if ($host = 3d.aijuying.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


  listen 80;
  server_name 3d.aijuying.com;
    return 404; # managed by Certbot


}